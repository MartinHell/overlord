apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "overlord.fullname" . }}-test-connection"
  labels:
    {{- include "overlord.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # /healthz rather than /: the root only serves the GraphQL playground when
      # ENVIRONMENT is not production, so testing it would fail on exactly the
      # configuration people should be running.
      args:
        - '-q'
        - '-O-'
        - 'http://{{ include "overlord.fullname" . }}:{{ .Values.service.port }}/healthz'
  restartPolicy: Never
