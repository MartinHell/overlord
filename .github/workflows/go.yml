name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # gqlgen v0.17.47 fails silently on newer toolchains, so pin the
          # version the module declares until gqlgen is upgraded.
          go-version: '1.22'
          cache: true

      - name: Generate GraphQL code
        run: go run github.com/99designs/gqlgen generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
