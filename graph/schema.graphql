scalar Time

type Event {
    id: ID!
    player: Player
    "One of: shot, hit, kill, crash, unit_lost, pilot_dead."
    event: String!
    "DCS mission clock in seconds when the event happened. Zero for events recorded before this was captured."
    missionTime: Float!
    "Coalition of the initiator when the event happened: red, blue, neutral or unknown."
    coalition: String
    initiator: Unit
    "What the initiator was: unit, weapon, static, scenery, airbase or unknown."
    initiatorKind: String
    target: Target
    "Coalition of the target. Equal to coalition means a teamkill."
    targetCoalition: String
    weapon: Weapon
    createdAt: Time!
    updatedAt: Time!
}

type CoalitionKills {
    coalition: String!
    kills: Int!
    teamkills: Int!
}

type Player {
    playerID: ID!
    createdAt: Time!
    updatedAt: Time!
    deletedAt: Time
    playerName: String
    ucid: String!
}

type Unit {
    unitID: ID!
    createdAt: Time!
    updatedAt: Time!
    deletedAt: Time
    type: String!
}

type Weapon {
    weaponID: ID!
    createdAt: Time!
    updatedAt: Time!
    deletedAt: Time
    type: String
}

type Target {
    targetID: ID!
    "What was hit: unit, weapon, static, scenery, airbase or unknown."
    kind: String
    player: Player
    unit: Unit
    weapon: Weapon
}

type EventConnection {
    edges: [EventEdge]!
    pageInfo: PageInfo!
}

type EventEdge {
    node: Event!
    cursor: String!
}

type PageInfo {
    endCursor: String
    hasNextPage: Boolean!
}

type UnitWeaponBreakdown {
    unitType: String!
    weapons: [WeaponShotBreakdown]!
}

type PlayerShotBreakdown {
    playerID: ID!
    playerName: String!
    units: [UnitShotBreakdown]!
}

type UnitShotBreakdown {
    unitType: String!
    weapons: [WeaponShotBreakdown]!
}

type WeaponShotBreakdown {
    weaponType: String!
    count: Int!
}

type Query {
    "Omit coalition to get both sides at once; pass red or blue to narrow."
    events(first: Int, after: String, eventType: String, coalition: String): EventConnection
    "Kill tally per coalition, covering both sides."
    killsByCoalition: [CoalitionKills!]!
    event(id: ID!): Event
    players: [Player]
    player(id: ID!): Player
    units: [Unit]
    unit(id: ID!): Unit
    weapons: [Weapon]
    weapon(id: ID!): Weapon
    healthcheck: String!
    shotsBreakdown: [UnitWeaponBreakdown]
    shotsByPlayers: [PlayerShotBreakdown]
    shotsByPlayer(playerID: ID!): PlayerShotBreakdown
}