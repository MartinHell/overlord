name: Lint and Test Charts

on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

# ct install is still disabled, but the reason has changed. SQLite now works in
# the container (the driver is pure Go), and charts/overlord/ci/sqlite-values.yaml
# configures it. The remaining blocker is that the chart deploys
# ghcr.io/martinhell/overlord:{{ .Chart.AppVersion }}, currently v0.0.1, which is
# the image published from main. ct install therefore tests the last released
# image rather than the branch under review, and v0.0.1 predates the pure-Go
# SQLite driver, so it cannot start from those values.
#
# To enable: either publish an image containing the pure-Go driver and point
# appVersion at it, or have this workflow build the branch image and load it into
# kind with `kind load docker-image` plus an image.tag override.
